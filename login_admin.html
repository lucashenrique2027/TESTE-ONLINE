<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel JM | Gestão Completa & Segura</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; background: #f4f7f6; color: #333; }
        .sidebar { width: 250px; background: #2c3e50; color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; z-index: 1001; transition: 0.3s; }
        .sidebar h2 { text-align: center; border-bottom: 2px solid #25D366; padding-bottom: 15px; font-size: 20px; }
        .sidebar nav p { cursor: pointer; padding: 12px; border-bottom: 1px solid #34495e; transition: 0.3s; margin: 0; font-size: 14px; }
        .sidebar nav p:hover { background: #34495e; padding-left: 20px; color: #25D366; }
        .content { margin-left: 250px; padding: 30px; width: calc(100% - 250px); box-sizing: border-box; transition: 0.3s; }
        .card-dash { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; overflow-x: auto; }
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; min-width: 600px; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; color: #666; font-size: 13px; text-transform: uppercase; }
        .btn-acao { background: #25D366; color: white; border: none; padding: 12px 25px; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .btn-del { background: #e74c3c; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
        .status-badge { padding: 5px 10px; border-radius: 20px; font-weight: bold; font-size: 11px; text-transform: uppercase; border: none; cursor: pointer; }
        .badge-disp { background: #e8f5e9; color: #2e7d32; }
        .badge-esg { background: #ffebee; color: #c62828; }
        .badge-prep { background: #fff3e0; color: #ef6c00; }
        .badge-env { background: #e3f2fd; color: #1565c0; }
        .resumo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .mini-card { background: white; padding: 20px; border-radius: 10px; border-left: 5px solid #25D366; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .mobile-header { display: none; background: #2c3e50; color: white; padding: 15px; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1002; }
        .menu-toggle { background: none; border: 1px solid #25D366; color: #25D366; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        @media (max-width: 768px) {
            .sidebar { left: -250px; }
            .sidebar.active { left: 0; }
            .content { margin-left: 0; width: 100%; padding: 15px; }
            .mobile-header { display: flex; }
            .resumo-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <script>if(sessionStorage.getItem("logado") !== "true") window.location.href = "index.html";</script>

    <div class="mobile-header">
        <span>JM ADMIN</span>
        <button class="menu-toggle" onclick="toggleSidebar()">☰ Menu</button>
    </div>

    <aside class="sidebar" id="sidebar">
        <h2>JM ADMIN</h2>
        <nav>
            <p onclick="showTab('estoque'); toggleSidebar()">📦 Estoque & Vitrine</p>
            <p onclick="showTab('pedidos'); toggleSidebar()">🚚 Pedidos Recebidos</p>
            <p onclick="showTab('usuarios'); toggleSidebar()">👥 Clientes</p>
        </nav>
        <div style="margin-top: 30px; padding: 0 10px;">
            <button onclick="sair()" style="width:100%; background:#e74c3c; color:white; border:none; padding:12px; border-radius:6px; cursor:pointer; font-weight:bold;">🚪 Sair</button>
        </div>
    </aside>

    <main class="content">
        <section id="estoque" class="tab-content">
            <div class="card-dash">
                <h3>📦 Controle de Estoque Online</h3>
                <div style="display:flex; gap:10px; background: #f0f2f5; padding: 15px; border-radius: 8px; flex-wrap: wrap;">
                    <select id="sel-prod-estoque" style="flex: 1; min-width: 200px;"></select>
                    <select id="sel-status" style="width: 150px;">
                        <option value="Disponível">✅ Disponível</option>
                        <option value="Esgotado">❌ Esgotado</option>
                    </select>
                    <button class="btn-acao" onclick="atualizarEstoque()">Aplicar Status</button>
                </div>
                <div style="overflow-x: auto;">
                    <table id="tabela-estoque">
                        <thead><tr><th>Produto</th><th>Status Atual</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="pedidos" class="tab-content" style="display:none;">
            <div class="resumo-cards">
                <div class="mini-card"><h4>Total de Pedidos</h4><p id="total-pedidos-count" style="font-size:24px; font-weight:bold; color:#2c3e50;">0</p></div>
            </div>
            <div class="card-dash">
                <h3>🚚 Gestão de Pedidos em Tempo Real</h3>
                <div style="overflow-x: auto;">
                    <table id="tabela-pedidos">
                        <thead><tr><th>ID</th><th>Cliente</th><th>Produto</th><th>Status</th><th>Ação</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="usuarios" class="tab-content" style="display:none;">
            <div class="card-dash">
                <h3>👥 Clientes Cadastrados (Local)</h3>
                <div style="overflow-x: auto;">
                    <table id="tabela-clientes">
                        <thead><tr><th>Nome</th><th>CPF</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://pubyfyfivodmnzrwpdhe.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_D87EPGcjKSxvp_GN5oaqxA_BsCL4EfY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

        async function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'estoque') renderEstoque();
            if(id === 'pedidos') renderPedidos();
            if(id === 'usuarios') renderClientes();
        }

        async function renderEstoque() {
            const { data: produtos, error } = await supabase.from('produtos').select('*');
            if (error) return;

            document.getElementById('sel-prod-estoque').innerHTML = produtos.map(p => `<option value="${p.nome}">${p.nome}</option>`).join('');
            document.querySelector('#tabela-estoque tbody').innerHTML = produtos.map(p => `
                <tr>
                    <td>${p.nome}</td>
                    <td><span class="status-badge ${p.status === 'Esgotado' ? 'badge-esg' : 'badge-disp'}">${p.status}</span></td>
                </tr>
            `).join('');
        }

        async function atualizarEstoque() {
            const nome = document.getElementById('sel-prod-estoque').value;
            const status = document.getElementById('sel-status').value;
            const { error } = await supabase.from('produtos').update({ status }).eq('nome', nome);
            if (!error) renderEstoque();
        }

        async function renderPedidos() {
            const { data: pedidos, error } = await supabase.from('pedidos').select('*').order('criado_em', { ascending: false });
            if (error) return;

            document.querySelector('#tabela-pedidos tbody').innerHTML = pedidos.map((ped) => `
                <tr>
                    <td>#${ped.id_unico}</td>
                    <td><b>${ped.cliente_nome}</b></td>
                    <td>${ped.produto_nome}</td>
                    <td>
                        <select class="status-badge ${ped.status_entrega === 'Entregue' ? 'badge-disp' : ped.status_entrega === 'Enviado' ? 'badge-env' : 'badge-prep'}" 
                                onchange="mudarStatusPedido('${ped.id}', this.value)">
                            <option value="Preparo" ${ped.status_entrega === 'Preparo' ? 'selected' : ''}>Preparo</option>
                            <option value="Enviado" ${ped.status_entrega === 'Enviado' ? 'selected' : ''}>Enviado</option>
                            <option value="Entregue" ${ped.status_entrega === 'Entregue' ? 'selected' : ''}>Entregue</option>
                        </select>
                    </td>
                    <td><button class="btn-del" onclick="excluirPedido('${ped.id}')">Excluir</button></td>
                </tr>
            `).join('');
            document.getElementById('total-pedidos-count').innerText = pedidos.length;
        }

        async function mudarStatusPedido(id, status_entrega) {
            await supabase.from('pedidos').update({ status_entrega }).eq('id', id);
            renderPedidos();
        }

        async function excluirPedido(id) {
            if(confirm("Excluir pedido permanentemente?")) {
                await supabase.from('pedidos').delete().eq('id', id);
                renderPedidos();
            }
        }

        function renderClientes() {
            const c = JSON.parse(localStorage.getItem('clientes_jm') || "[]");
            document.querySelector('#tabela-clientes tbody').innerHTML = c.map(cli => `<tr><td>${cli.nome}</td><td>${cli.cpf}</td></tr>`).join('');
        }

        function sair() { sessionStorage.clear(); window.location.href = "index.html"; }

        // Real-time
        supabase.channel('admin-changes').on('postgres_changes', { event: '*', schema: 'public', table: '*' }, () => {
            if (document.getElementById('estoque').style.display !== 'none') renderEstoque();
            if (document.getElementById('pedidos').style.display !== 'none') renderPedidos();
        }).subscribe();

        window.onload = () => showTab('estoque');
    </script>
</body>
</html>
