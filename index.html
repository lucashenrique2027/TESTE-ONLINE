<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arte em Vidro | Vitrine</title>
  <link rel="icon" type="image/png" href="img/logo.jpeg">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #f4f7f6; color: #333; font-family: 'Montserrat', sans-serif; margin: 0; }
    header { background: #fff; padding: 10px 0; border-bottom: 1px solid #ddd; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top:0; z-index:1000; }
    .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .user-menu { display: flex; align-items: center; gap: 12px; position: relative; cursor: pointer; }
    .dropdown-content { display: none; position: absolute; right: 0; top: 40px; background: white; min-width: 250px; box-shadow: 0 8px 16px rgba(0,0,0,0.15); z-index: 100; border-radius: 8px; padding: 15px; border: 1px solid #eee; }
    .galeria-profissional { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
    .card-item { background: #fff; border-radius: 12px; padding: 20px; text-align: center; border: 1px solid #eee; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.02); position: relative; display: flex; flex-direction: column; }
    .selo-status { position: absolute; top: 15px; left: 15px; padding: 5px 12px; font-size: 10px; font-weight: bold; border-radius: 4px; z-index: 10; color: white; text-transform: uppercase; }
    .img-container img { width: 100%; height: 350px; object-fit: cover; border-radius: 8px; background: #eee; }
    .compra-acoes { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 15px; }
    .controle-qtd { display: flex; align-items: center; background: #fff; border-radius: 5px; border: 1px solid #bbb; overflow: hidden; }
    .btn-qtd { background: #eee; border: none; width: 35px; height: 38px; cursor: pointer; font-weight: bold; font-size: 18px; color: #000; }
    .qtd-seletor { width: 45px; height: 38px; text-align: center; border: none; background: #fff; font-weight: bold; font-size: 16px; color: #000 !important; }
    .btn-add { flex: 1; background-color: #25D366; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; height: 38px; }
    .btn-info { width: 100%; margin-top: 8px; background-color: #f8f9fa; color: #555; border: 1px solid #ddd; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display:none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-box { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; max-height: 90vh; overflow-y: auto; }
    input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
    .btn-acao { background: #25D366; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .link-voltar { display: block; margin-top: 15px; color: #666; font-size: 13px; cursor: pointer; text-decoration: underline; }
    .status-item { font-size: 12px; padding: 8px; border-bottom: 1px solid #eee; text-align: left; }
    @media (max-width: 600px) {
        .header-container { padding: 0 15px; }
        .galeria-profissional { grid-template-columns: 1fr; padding: 20px 15px; }
        .img-container img { height: 280px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <h1 style="color: #333; margin: 0; font-size: 22px;">Arte em Vidro</h1>
    <div class="user-menu" onclick="toggleUserMenu()">
      <span id="nome-usuario-logado" style="font-size: 13px; color: #25D366; font-weight: bold;">Entrar / Cadastro</span>
      <img src="https://cdn-icons-png.flaticon.com/512/3177/3177440.png" width="30">
      <div id="dropdown-menu" class="dropdown-content" onclick="event.stopPropagation()">
        <div id="menu-deslogado"><button class="btn-acao" onclick="abrirModalEscolha()">Minha Conta</button></div>
        <div id="menu-logado" style="display:none;">
          <p id="info-perfil" style="font-weight:bold; margin:0;"></p>
          <div id="status-pedidos-menu" style="margin: 10px 0;"></div>
          <button onclick="logoutUsuario()" style="color:red; background:none; border:none; cursor:pointer; font-weight:bold;">Sair</button>
        </div>
        <hr style="margin: 10px 0; border:0; border-top: 1px solid #eee;">
        <a href="javascript:void(0)" onclick="executarAcessoAdmin()" style="font-size: 10px; color: #ccc; text-decoration: none;">🔐 Painel Administrativo</a>
      </div>
    </div>
  </div>
</header>

<div id="vitrine" class="galeria-profissional"></div>

<script>
const SUPABASE_URL = 'https://pubyfyfivodmnzrwpdhe.supabase.co';
const SUPABASE_KEY = 'sb_publishable_D87EPGcjKSxvp_GN5oaqxA_BsCL4EfY';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const produtosFixos = [
    { nome: "Vaso Girassol", img: "img/girasol WhatsApp Image 2025-08-13 at 17.14.00.jpeg" },
    { nome: "Jogo Suqueira + 6 Copos", img: "img/6 copos suqueira Image 1 de set. de 2025, 13_30_19.png" },
    { nome: "Pote Sustentável T", img: "img/pode T Image 8 de set. de 2025, 22_31_52.png" },
    { nome: "Vaso Design Geométrico", img: "img/Vaso de vidro com design geométrico.png" },
    { nome: "Taça de Cristal Premium", img: "img/taça- Image 28 de set. de 2025, 14_21_19.png" },
    { nome: "Vaso Coloriquadra", img: "img/vaso-coloriquadra Image 1 de set. de 2025, 16_28_27.png" }
];

async function carregarVitrine() {
    const { data: produtosDB } = await supabaseClient.from('produtos').select('*');
    const vitrine = document.getElementById('vitrine');
    
    vitrine.innerHTML = produtosFixos.map((p, index) => {
        const dbProd = produtosDB ? produtosDB.find(db => db.nome === p.nome) : null;
        const esgotado = dbProd && dbProd.status === "Esgotado";
        return `
            <div class="card-item" style="${esgotado ? 'opacity: 0.6;' : ''}">
                <div class="selo-status" style="background: ${esgotado ? '#e74c3c' : '#25D366'}">${esgotado ? 'ESGOTADO' : 'DISPONÍVEL'}</div>
                <div class="img-container"><img src="${p.img}" style="${esgotado ? 'filter: grayscale(1);' : ''}"></div>
                <p><b>${p.nome}</b></p>
                <div class="compra-acoes">
                    <button class="btn-add" ${esgotado ? 'disabled style="background:#ccc;"' : ''} onclick="pedir('${p.nome}', ${index})">
                        ${esgotado ? 'Sem Estoque' : 'Pedir'}
                    </button>
                </div>
            </div>`;
    }).join('');
    verificarLogin();
}

// === FUNÇÃO MÁGICA: ATUALIZA SOZINHO (REALTIME) ===
supabaseClient.channel('custom-all-channel')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'produtos' }, () => {
    console.log("Estoque mudou no Admin! Atualizando vitrine...");
    carregarVitrine();
  })
  .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, () => {
    console.log("Status de pedido mudou! Atualizando menu do cliente...");
    verificarLogin();
  })
  .subscribe();

// Funções de login/logout e pedido permanecem iguais...
window.onload = carregarVitrine;
</script>
</body>
</html>
